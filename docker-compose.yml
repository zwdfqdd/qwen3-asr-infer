# 单 GPU Qwen3-ASR：发布镜像须已包含代码、依赖、主模型和 ForcedAligner 模型。
# 本文件只拉取并运行固定镜像，不在本机构建，也不映射宿主模型目录。
# ${变量:-默认值} 由 Compose 在创建容器前展开，再由镜像内 run.sh 读取。
services:
  qwen3-asr:
    image: zhxgharbor.istarshine.com/asr/qwen3-asr-infer:0.19.1
    container_name: qwen3-asr
    # 容器异常退出或 Docker 重启后自动拉起；手工 stop 后保持停止，直到再次启动。
    restart: unless-stopped
    # stop/down/restart 时先发送 SIGTERM，最多等待 2 分钟清理网关、vLLM 和 CUDA 资源；
    # 超时后 Docker 才发送 SIGKILL。它不是请求超时或服务启动超时。
    stop_grace_period: 2m
    # vLLM/PyTorch 多进程张量通信使用的容器共享内存，默认 16 GiB。
    shm_size: ${SHM_SIZE:-16gb}
    ports:
      # HOST_PORT 是宿主端口；容器内仅对外暴露 aiohttp 网关 8080。
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # 仅持久化网关轮转日志；模型仍完全使用镜像内目录，不映射宿主模型。
      - asr-logs:/var/log/qwen3-asr
    # Docker 分别采集网关 JSON stdout 与 run.sh/下载器/vLLM stderr；轮转独立于应用参数。
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-100m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"

    environment:
      # 服务元数据与端口；vLLM 8081 仅监听容器回环地址。
      SERVICE_VERSION: "${SERVICE_VERSION:-2.1.0}"
      VLLM_HOST: "127.0.0.1"
      VLLM_PORT: "8081"
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      BACKEND_URL: "http://127.0.0.1:8081"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-qwen3-asr}"

      # 网关结构化日志：stdout 供 Docker 采集；有界异步队列写入大小轮转文件。
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FILE_ENABLED: "${LOG_FILE_ENABLED:-true}"
      LOG_DIR: "/var/log/qwen3-asr"
      LOG_MAX_FILE_MB: "${LOG_MAX_FILE_MB:-200}"
      LOG_BACKUP_COUNT: "${LOG_BACKUP_COUNT:-7}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-7}"
      LOG_QUEUE_SIZE: "${LOG_QUEUE_SIZE:-10000}"

      # 镜像内 ModelScope 固定 revision 模型；run.sh 启动时仍执行完整性校验。
      VLLM_MODEL_ID: "${VLLM_MODEL_ID:-Qwen/Qwen3-ASR-0.6B}"
      VLLM_MODEL_DIR: "${VLLM_MODEL_DIR:-models/qwen3-asr-0.6b/vllm}"
      MODELSCOPE_REVISION: "${MODELSCOPE_REVISION:-4ce9cc728b473a5aedbe7b6e1ea45646316824dc}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

      # vLLM 引擎与 continuous batching；显存为比例，长度和预算单位为 token。
      DTYPE: "${DTYPE:-bfloat16}"
      VLLM_LOAD_FORMAT: "${VLLM_LOAD_FORMAT:-safetensors}"
      # 固定默认显存预算为 0.85；调用方仍可通过同名环境变量显式覆盖。
      VLLM_GPU_MEMORY_UTILIZATION: "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-10240}"
      VLLM_MAX_NUM_SEQS: "${VLLM_MAX_NUM_SEQS:-128}"
      VLLM_MAX_NUM_BATCHED_TOKENS: "${VLLM_MAX_NUM_BATCHED_TOKENS:-10240}"
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: "${VLLM_MAX_AUDIO_CLIP_FILESIZE_MB:-96}"
      VLLM_ATTENTION_BACKEND_NAME: "${VLLM_ATTENTION_BACKEND_NAME:-FLASH_ATTN}"
      VLLM_STARTUP_TIMEOUT: "${VLLM_STARTUP_TIMEOUT:-600}"

      # 网关限制：时长/超时单位秒，大小单位 MiB，并发项单位为任务数。
      AUDIO_CHUNK_SECONDS: "${AUDIO_CHUNK_SECONDS:-32}"
      MAX_AUDIO_SECONDS: "${MAX_AUDIO_SECONDS:-7500}"
      # MAX_UPLOAD_MB 限制解码后音频/multipart 文件；MAX_JSON_BODY_MB 限制完整 JSON 请求体。
      # 两者按 7500 秒 16 kHz 单声道 PCM16 WAV 推导：音频 240,000,044 字节约 228.88 MiB，
      # Base64 膨胀 4/3 后约 305.18 MiB。三项互相绑定，改时长必须同步重算字节上限。
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-229}"
      MAX_JSON_BODY_MB: "${MAX_JSON_BODY_MB:-308}"
      CHUNK_CONCURRENCY: "${CHUNK_CONCURRENCY:-3}"
      LONG_CHUNKS_IN_FLIGHT: "${LONG_CHUNKS_IN_FLIGHT:-96}"
      BACKEND_TIMEOUT: "${BACKEND_TIMEOUT:-300}"
      BACKEND_CONNECTION_LIMIT: "${BACKEND_CONNECTION_LIMIT:-100}"
      BACKEND_KEEPALIVE_TIMEOUT: "${BACKEND_KEEPALIVE_TIMEOUT:-4}"
      ENABLE_VAD: "false"

      # 动态热词仅作为 Qwen3-ASR Prompt 软偏置。
      ENABLE_HOTWORD: "${ENABLE_HOTWORD:-true}"
      MAX_HOTWORDS: "${MAX_HOTWORDS:-100}"
      MAX_HOTWORD_LENGTH: "${MAX_HOTWORD_LENGTH:-64}"
      MAX_HOTWORD_CHARS: "${MAX_HOTWORD_CHARS:-1000}"

      # 镜像内 ForcedAligner；默认启用真实字/词级及句级时间戳。
      ENABLE_WORD_TIMESTAMP: "${ENABLE_WORD_TIMESTAMP:-true}"
      ENABLE_SENTENCE_TIMESTAMP: "${ENABLE_SENTENCE_TIMESTAMP:-true}"
      ALIGNER_MODEL_ID: "${ALIGNER_MODEL_ID:-Qwen/Qwen3-ForcedAligner-0.6B}"
      ALIGNER_MODEL_DIR: "${ALIGNER_MODEL_DIR:-models/qwen3-forced-aligner-0.6b/pt}"
      ALIGNER_MODELSCOPE_REVISION: "${ALIGNER_MODELSCOPE_REVISION:-cf1c50164ea3ac48240d12bef5ead74aee0720cc}"
      ALIGNER_DEVICE: "${ALIGNER_DEVICE:-cuda:0}"
      ALIGNER_DTYPE: "${ALIGNER_DTYPE:-bfloat16}"
      ALIGNER_ATTENTION_BACKEND: "${ALIGNER_ATTENTION_BACKEND:-auto}"
      ALIGNER_CONCURRENCY: "${ALIGNER_CONCURRENCY:-1}"
      # batch=32 为目标 A10 实测最佳平衡：端到端 107.33→228.57 audio_s/s，显存峰值约 20315 MiB。
      # batch=1 保留为逐片回滚值；放大到 48 已因收益不足 5% 被拒绝。
      ALIGNER_BATCH_SIZE: "${ALIGNER_BATCH_SIZE:-32}"
      ALIGNER_DECODE_WORKERS: "${ALIGNER_DECODE_WORKERS:-1}"
      ALIGNER_PREDECODE_ENABLED: "${ALIGNER_PREDECODE_ENABLED:-false}"
      ALIGNER_PREDECODE_MAX_MB: "${ALIGNER_PREDECODE_MAX_MB:-128}"
      ALIGNER_BATCH_WAIT_MS: "${ALIGNER_BATCH_WAIT_MS:-5}"
      ALIGNER_QUEUE_SIZE: "${ALIGNER_QUEUE_SIZE:-256}"
      # 分片级流水：分片 ASR 完成即提交对齐。单分片请求与批量模式等价，多分片长音频才有
      # 收益；默认关闭，待目标机多分片实测后再评估默认值。
      ALIGNER_PIPELINE_ENABLED: "${ALIGNER_PIPELINE_ENABLED:-false}"

      # NVIDIA MPS：让 vLLM 与 Aligner 的 kernel 并发执行，目标 A10 实测端到端吞吐
      # +19.97%、P95 -16.32%，显存仅增加约 217 MiB。
      # MPS 是宿主级透明特性，仅靠环境变量无法决定是否走 MPS，因此 run.sh 会主动管理守护
      # 进程：true 时不在线就启动，false 时在线且无活跃客户端就停止；有活跃客户端则拒绝启动，
      # 不强行影响可能共用该守护进程的其他进程。两个方向的不一致都会让吞吐相差约 20%。
      # 容器内启动守护进程需要 ipc: host；未挂载管道目录时容器看不到宿主守护进程。
      ENABLE_MPS: "${ENABLE_MPS:-false}"
      CUDA_MPS_PIPE_DIRECTORY: "${CUDA_MPS_PIPE_DIRECTORY:-/tmp/nvidia-mps}"
      CUDA_MPS_LOG_DIRECTORY: "${CUDA_MPS_LOG_DIRECTORY:-/tmp/nvidia-mps-log}"

    # 使用 MPS 需要额外放开容器隔离，因此不设为默认值。需要时取消以下注释：
    #   ipc: host
    #   并在上方 volumes 增加：
    #     - /tmp/nvidia-mps:/tmp/nvidia-mps
    #     - /tmp/nvidia-mps-log:/tmp/nvidia-mps-log
    # ipc: host 会与宿主共享 IPC 命名空间，降低容器隔离性；请按安全要求评估后再启用。
    # 未挂载管道目录时，容器内进程看不到宿主守护进程，因此不会接入 MPS。
    # 实测故障场景：网关退出、网关重启、控制守护进程被强杀均不影响 vLLM 与时间戳正确性。

    deploy:
      resources:
        reservations:
          devices:
            # GPU_DEVICE_ID 是宿主 NVIDIA GPU 索引；每个服务只绑定一张卡。
            # 单卡注入容器后通常映射为容器内 cuda:0，因此 ALIGNER_DEVICE 保持 cuda:0。
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      # 每 30 秒检查一次，单次 5 秒超时；连续 3 次失败才标记 unhealthy。
      interval: 30s
      timeout: 5s
      retries: 3
      # 启动宽限期覆盖 run.sh 最长 600 秒的 vLLM 就绪等待；期间失败不计入 retries。
      start_period: 10m

volumes:
  # Docker 管理的日志命名卷；docker compose down 默认保留，down -v 才删除。
  asr-logs:
